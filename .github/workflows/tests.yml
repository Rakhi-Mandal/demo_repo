name: Regression tests
run-name: Regression ${{ inputs.project_id }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Project identifier
        required: false
        type: string
      service_type:
        description: Automation type
        required: false
        type: string
      modules:
        description: Comma-separated test folders (for example sanity/login,regression)
        required: true
        type: string
      browsers:
        description: Comma-separated Playwright projects (chromium,firefox,webkit)
        required: true
        type: string
      request_id:
        description: Unique ID from the dashboard request
        required: false
        type: string

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}

      - name: Install selected Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          IFS=',' read -ra browsers <<< "$BROWSERS"
          for browser in "${browsers[@]}"; do
            browser="$(echo "$browser" | xargs)"
            [[ -n "$browser" ]] && npx playwright install --with-deps "$browser"
          done

      - name: Install system dependencies for selected browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          IFS=',' read -ra browsers <<< "$BROWSERS"
          for browser in "${browsers[@]}"; do
            browser="$(echo "$browser" | xargs)"
            [[ -n "$browser" ]] && npx playwright install-deps "$browser"
          done

      - name: Run selected modules and browsers
        shell: bash
        env:
          MODULES: ${{ inputs.modules }}
          BROWSERS: ${{ inputs.browsers }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/junit.xml
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/results.json
        run: |
          mkdir -p reports
          args=()

          IFS=',' read -ra folders <<< "$MODULES"
          for folder in "${folders[@]}"; do
            folder="$(echo "$folder" | xargs)"
            [[ -n "$folder" ]] && args+=("$folder")
          done

          IFS=',' read -ra browsers <<< "$BROWSERS"
          for browser in "${browsers[@]}"; do
            browser="$(echo "$browser" | xargs)"
            [[ -n "$browser" ]] && args+=("--project=$browser")
          done

          npx playwright test "${args[@]}" --reporter=html,junit,json,list

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit and JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload traces, screenshots, and videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7